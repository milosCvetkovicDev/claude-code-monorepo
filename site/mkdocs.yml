# mkdocs config for the online edition.
#
# docs_dir points at _build/docs, which site/build.py stages — nothing in the repository
# moves to satisfy the site generator. See that script's header for why.
site_name: claude-code-monorepo
site_description: >-
  The real Claude Code configuration behind a 13-service TypeScript platform,
  organized as a 13-chapter book. Loop engineering: maker ≠ checker, verifiable
  stop conditions.
site_url: https://miloscvetkovicdev.github.io/claude-code-monorepo/
repo_url: https://github.com/milosCvetkovicDev/claude-code-monorepo
repo_name: milosCvetkovicDev/claude-code-monorepo
edit_uri: ""

docs_dir: _build/docs
site_dir: _build/site

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Dark by default — it matches the social card and how most readers arrive.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # NOTE the class is `diagram`, not `mermaid`. Material's own mermaid integration
        # keys on `.mermaid`: it empties the element and renders with a copy it fetches
        # from unpkg at a floating major version. Verified by experiment — a preloaded
        # window.mermaid does NOT make it stand down; the element just ends up blank when
        # the CDN is unreachable. Using a class it does not claim leaves rendering to
        # site/mermaid-init.js and the pinned, self-hosted build.
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/milosCvetkovicDev
      name: milosCvetkovicDev on GitHub
  generator: false

extra_css:
  - assets/extra.css

# Self-hosted, checksum-pinned mermaid (see site/mermaid-init.js), rendering `.diagram`
# fences that Material's CDN-backed integration deliberately does not claim.
extra_javascript:
  - assets/mermaid.min.js
  - assets/mermaid-init.js

